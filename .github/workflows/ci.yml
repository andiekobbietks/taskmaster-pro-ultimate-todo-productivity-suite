name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Worker bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No lockfile is committed by design, so this resolves fresh rather than
      # using `npm ci`.
      - name: Install dependencies
        run: npm install

      # The front end is now compiled: esbuild bundles src/app.jsx and the
      # Tailwind CLI emits public/assets/app.css. Neither wrangler nor this
      # workflow can serve the app without them, so build before bundling.
      - name: Build the front end
        run: npm run build

      - name: Assert build output exists
        run: |
          test -s public/assets/app.js  || { echo "::error::public/assets/app.js was not produced"; exit 1; }
          test -s public/assets/app.css || { echo "::error::public/assets/app.css was not produced"; exit 1; }

      # A dry-run deploy bundles the Worker exactly as `wrangler deploy` would,
      # but uploads nothing and needs no credentials. It fails on a broken
      # import, a bad wrangler.json, or an asset path that no longer exists.
      - name: Bundle the Worker (dry run)
        run: npx --yes wrangler@4 deploy --dry-run --outdir dist

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: worker-bundle
          path: dist/
          retention-days: 7

  docs:
    name: Docs match the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # docs/READINESS.md and docs/readiness.json are generated from the feature,
      # architecture, and SBOM inventories. This job re-derives them and fails if
      # the committed copies drifted, so a claim about readiness can never
      # silently disagree with the code.
      #
      # docs/readiness.json embeds a wall-clock "generated" timestamp, so it is
      # compared with that single volatile line stripped; every other file under
      # docs/ must match byte for byte.
      - name: Regenerate the maturity checklist
        run: node docs/scripts/readiness.mjs

      - name: Fail if generated docs drifted
        run: |
          if ! git diff --exit-code -- docs/ ':!docs/readiness.json'; then
            echo "::error::docs/ is out of date. Run 'node docs/scripts/readiness.mjs' and commit the result."
            git --no-pager diff -- docs/
            exit 1
          fi

          git show HEAD:docs/readiness.json | grep -v '"generated"' > /tmp/committed.json
          grep -v '"generated"' docs/readiness.json > /tmp/regenerated.json
          if ! diff -u /tmp/committed.json /tmp/regenerated.json; then
            echo "::error::docs/readiness.json drifted beyond its timestamp. Regenerate and commit."
            exit 1
          fi

  seed:
    name: Seed fixtures are valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Guards the fixtures the QA/chaos seeder depends on, so a malformed
      # fixture is caught here instead of during someone's test session.
      - name: Validate seed fixtures
        run: node scripts/validate-seed.mjs

  test:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The API tests drive the real Hono routes against an in-memory SQLite
      # database. They need no Worker runtime, so they are fast and cannot
      # flake the way a live dev server can.
      - name: Install dependencies
        run: npm install

      - name: Run API tests
        run: npm test

      # The regression suite for the settings merge, the settings reset, the
      # profile's single home and the digest's eligibility. It drives the
      # same real routes, so it belongs in the same job.
      - name: Run route regression tests
        run: node --experimental-strip-types scripts/test-bugfixes.mjs

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The front end has to be built: the mock API serves public/, and the
      # browser checks load the real bundle.
      - name: Install dependencies
        run: npm install

      - name: Build the front end
        run: npm run build

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      # The browser checks run against the mock API, which serves the built
      # assets and a fixed set of fixtures. No Worker runtime is involved.
      - name: Start the mock API
        run: |
          node scripts/mock-api.mjs 8821 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8821/api/hackathons > /dev/null; then
              echo "mock API is up"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the mock API did not start on port 8821"
          exit 1

      # 18 checks: the Add Hackathon form, the populated settings screen,
      # per-card screenshot upload, bulk selection in both lists, and the
      # app rendering with every external request blocked.
      - name: Run browser tests
        env:
          TM_BASE: http://127.0.0.1:8821
          TM_SHOTS: ${{ runner.temp }}/tm-screenshots
        run: python scripts/verify-ui.py

      - name: Stop the mock API
        if: always()
        run: kill "$SERVER_PID" || true
