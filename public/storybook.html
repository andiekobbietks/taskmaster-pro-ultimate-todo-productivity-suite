<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskMaster Pro — Component Library</title>
  <!-- Fonts load without blocking the first paint. The app renders in the
       system stack immediately and swaps to Inter when the webfont arrives,
       so the whole interface works with no network at all. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  </noscript>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body class="bg-[#F8FAFC] dark:bg-[#0A0E1A] text-[#0F172A] dark:text-[#F1F5F9] font-sans antialiased">
  <div id="root"></div>
  <script src="/assets/storybook.js" defer></script>
</body>
</html>
