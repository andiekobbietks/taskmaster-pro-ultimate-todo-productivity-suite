name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Pull this version's section out of CHANGELOG.md so the GitHub Release
      # notes are written once, in the changelog, and reused verbatim here.
      - name: Extract notes from CHANGELOG.md
        run: node scripts/extract-changelog.mjs "$GITHUB_REF_NAME"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
