<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskMaster Pro - Ultimate Todo & Productivity Suite</title>

  <!-- Fonts are the one remaining third-party request. Everything else below is
       served from this Worker: no CDN, no SRI hash to go stale, no third-party
       script executing with full page privilege.

       The stylesheet loads without blocking the first paint. The app renders in
       the system stack immediately and swaps to Inter when the webfont arrives,
       so the whole interface works with no network at all. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  </noscript>

  <!-- Compiled by 'npm run build': Tailwind utilities plus the design tokens
       and keyframes that used to live in public/style.css (now src/tailwind.css).
       Replaces the Tailwind Play CDN that used to be loaded from
       cdn.tailwindcss.com at runtime. -->
  <link rel="stylesheet" href="/assets/app.css">

  <!-- The app is installable: a manifest, the icons it points at, and the
       bits iOS needs for a Home Screen web app. iOS ignores the manifest
       for most things but it does read the apple-touch-icon, and it needs
       apple-mobile-web-app-capable for the app to open without the
       browser chrome. -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <meta name="theme-color" content="#5E6AD2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TaskMaster">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body class="bg-[#F8FAFC] dark:bg-[#0A0E1A] text-[#0F172A] dark:text-[#F1F5F9] font-sans antialiased selection:bg-brand-500/20 selection:text-brand-600">
  <div id="root"></div>

  <!-- Bundled by esbuild from src/app.jsx. This replaces three CDN scripts and
       ~40KB of in-browser JSX transpilation by @babel/standalone:
         - react / react-dom / lucide-react  (were esm.sh importmap entries)
         - @babel/standalone                 (was unpkg)
         - the inline <script type="text/babel"> block
       The bundle is an ordinary script, not a module, so it needs no importmap
       and no MIME type cooperation from the host. -->
  <script src="/assets/app.js" defer></script>
</body>
</html>
